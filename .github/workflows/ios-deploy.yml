name: iOS TestFlight Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Install Apple Certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          
          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Resolve CocoaPods and iOS Build Environment
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
        working-directory: apps/mobile

      - name: Build iOS Application (Signed IPA or Unsigned App)
        id: build_ios
        env:
          HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$HAS_CERT" ]; then
            echo "Certificate found. Building signed release IPA..."
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
            echo "build_type=ipa" >> $GITHUB_ENV
          else
            echo "No signing certificate configured. Building unsigned iOS release..."
            # Generate Flutter app assets and framework without device code-signing checks
            flutter build ios --release --no-codesign --config-only || true
            cd ios
            # Build archive or runner directly using xcodebuild with code signing disabled
            xcodebuild -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY="" \
              clean build
            cd ..
            
            # Locate Runner.app in DerivedData or standard output locations
            APP_DIR=$(find ios/build/DerivedData -name "Runner.app" -type d | head -n 1)
            if [ -z "$APP_DIR" ]; then
              APP_DIR=$(find build/ios -name "Runner.app" -type d | head -n 1)
            fi
            
            echo "Found Runner.app at: $APP_DIR"
            mkdir -p build/ios/ipa/Payload
            cp -r "$APP_DIR" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r patchwork-unsigned.ipa Payload
            rm -rf Payload
            cd ../../..
            echo "build_type=unsigned_ipa" >> $GITHUB_ENV
          fi
        working-directory: apps/mobile


      - name: Locate IPA file
        id: find_ipa
        run: |
          IPA_PATH=$(find apps/mobile/build/ios/ipa -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA at: $IPA_PATH"

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: patchwork-ios-ipa
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.APPSTORE_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@v1
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

